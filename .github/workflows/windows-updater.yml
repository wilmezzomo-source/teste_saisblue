name: Windows updater
on:
  push:
    branches: [crm-windows]
    paths: ['desktop/**', 'desktop_worker.py', 'automatic_start.py', 'supervise_crm.py', '*update*.py', 'test_*.py', 'test_*.cjs', 'server.py', 'notifications.py', 'web_push.py', 'configurar_iphone.py', 'requirements.txt', 'qualification*.py', 'locations.py', 'public/**', 'runtime_control.py', 'launch.py', 'iniciar_https.py', 'windows-release.json', '.github/workflows/windows-updater.yml', '.github/run_windows_tests.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile Windows application
        shell: pwsh
        run: |
          $delivered = Join-Path $env:RUNNER_TEMP 'SaisBlue-delivered.exe'
          Copy-Item desktop/SaisBlue-Atualizador.exe $delivered
          $compiler = Get-ChildItem "$env:ProgramFiles\dotnet\sdk\*\Roslyn\bincore\csc.dll" | Sort-Object FullName | Select-Object -Last 1
          $refs = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          python desktop/build.py --dotnet dotnet --compiler $compiler.FullName --refs $refs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $delivered desktop/SaisBlue-Atualizador.exe -Force
      - name: Tests and real Windows lifecycle
        env:
          SAISBLUE_NATIVE_WINDOWS_TEST: '1'
        run: python .github/run_windows_tests.py
      - name: Service worker privacy and notification links
        run: node test_service_worker.cjs
